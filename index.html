<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d13" />
<meta name="description" content="Verify a UPI payment before handing over the goods. Track payments, check a payer against your records, and generate a UPI collect QR." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PayCheck" />
<title>PayCheck — verify a UPI payment before you hand over goods</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============================ AUTH SCREEN ============================ -->
<section id="authScreen" class="auth-screen">
  <div class="auth-wrap">
    <div class="auth-hero">
      <div class="logo big" id="authLogo"></div>
      <h1>PayCheck</h1>
      <p class="auth-tagline" data-i18n="authTagline">
        Verify the payment before you hand over the goods.
      </p>
      <ul class="auth-points">
        <li><span data-icon="activity"></span><span data-i18n="authPoint1">Track every UPI payment you receive</span></li>
        <li><span data-icon="search"></span><span data-i18n="authPoint2">Check a payer against your own records</span></li>
        <li><span data-icon="qr"></span><span data-i18n="authPoint3">Generate a UPI QR to collect money</span></li>
      </ul>
    </div>

    <div class="auth-card">
      <div class="seg" id="authSeg">
        <button class="seg-btn active" data-auth="signin" type="button" data-i18n="signIn">Sign in</button>
        <button class="seg-btn" data-auth="signup" type="button" data-i18n="signUp">Create account</button>
      </div>

      <form id="authForm" autocomplete="on">
        <div class="field" id="fName" hidden>
          <label data-i18n="fName">Your name</label>
          <input id="auName" autocomplete="name" placeholder="Ramesh Kumar" />
        </div>
        <div class="field" id="fShop" hidden>
          <label data-i18n="fShop">Shop / business name</label>
          <input id="auShop" placeholder="Ramesh General Store" />
        </div>
        <div class="field">
          <label data-i18n="fEmail">Email</label>
          <input id="auEmail" type="email" autocomplete="username" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label data-i18n="fPassword">Password</label>
          <input id="auPass" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <div class="hint" id="passHint" hidden data-i18n="passHint">At least 8 characters.</div>
        </div>
        <div class="field" id="fPin" hidden>
          <label data-i18n="fPin">App PIN (optional, 4–6 digits)</label>
          <input id="auPin" inputmode="numeric" maxlength="6" placeholder="1234" />
          <div class="hint" data-i18n="pinHint">Quick unlock next time. You can skip this.</div>
        </div>
        <div class="auth-error" id="authError" hidden></div>
        <button class="btn" id="authSubmit" type="submit" data-i18n="signIn">Sign in</button>
      </form>

      <button class="btn ghost sm" id="demoBtn" type="button" data-i18n="useDemo">
        Use the demo account
      </button>
      <p class="auth-note" id="cryptoNote" hidden></p>
    </div>
  </div>
</section>

<!-- ============================= MAIN APP ============================= -->
<div class="phone" id="mainScreen" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="brandLogo"></div>
      <div class="brand-text">
        <strong data-i18n="appName">PayCheck</strong>
        <span id="shopName" data-i18n="tagline">UPI payment verifier</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="lang-btn" id="langBtn" type="button" title="Change language">हिं</button>
      <button class="icon-btn" id="installBtn" type="button" title="Install app" hidden data-icon="download"></button>
      <button class="user-chip" id="userChip" type="button" title="Account"></button>
      <button class="icon-btn" id="logoutBtn" type="button" title="Sign out" data-icon="logout"></button>
    </div>
  </header>

  <main id="view" class="view"><!-- views render here --></main>

  <nav class="tabbar">
    <button class="tab active" data-tab="tx" type="button">
      <span class="tab-ico" data-icon="receipt"></span><span data-i18n="tabTx">Payments</span>
    </button>
    <button class="tab" data-tab="add" type="button">
      <span class="tab-ico" data-icon="plus"></span><span data-i18n="tabAdd">Add</span>
    </button>
    <button class="tab" data-tab="verify" type="button">
      <span class="tab-ico" data-icon="shield"></span><span data-i18n="tabVerify">Verify</span>
    </button>
    <button class="tab" data-tab="qr" type="button">
      <span class="tab-ico" data-icon="qr"></span><span data-i18n="tabQr">QR</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <span class="tab-ico" data-icon="settings"></span><span data-i18n="tabSettings">Settings</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalHost"></div>

<script src="vendor/qrcode.min.js"></script>
<script src="icons.js"></script>
<script src="auth.js"></script>
<script src="gateway.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
<script>
  // Hydrate declarative icon placeholders: <span data-icon="name">.
  document.querySelectorAll('[data-icon]').forEach((n) => {
    if (window.Icon) n.innerHTML = window.Icon(n.dataset.icon, n.classList.contains('tab-ico') ? 21 : 18);
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // Check for a new deploy on every load so fixes reach users promptly.
        reg.update().catch(() => {});
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
