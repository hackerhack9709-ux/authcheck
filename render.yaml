# Render.com blueprint — deploy PayCheck (app + Razorpay proxy) in one service.
#
#   1. Push this repo to GitHub.
#   2. Render → New → Blueprint → pick the repo.
#   3. Fill the four secrets when prompted (they are marked sync: false).
#
# The same Dockerfile also works on Railway, Fly.io and any Docker host.

services:
  - type: web
    name: paycheck
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PROXY_USER
        sync: false
      - key: PROXY_PASS
        sync: false
